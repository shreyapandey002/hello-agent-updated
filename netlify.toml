[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "vite --port=3000 --host=0.0.0.0"
  port = 8888
  targetPort = 3000
  functions = "netlify/functions"

[[redirects]]
  from = "/api/book-consultation"
  to = "/.netlify/functions/book-consultation"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth-:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
[[redirects]]
  from = "/login"
  to = "/"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/"
  status = 200

[[redirects]]
  from = "/mailbox"
  to = "/"
  status = 200

[[redirects]]
  from = "/mailbox/*"
  to = "/"
  status = 200
