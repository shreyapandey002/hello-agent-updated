[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "vite --port=3000 --host=0.0.0.0"
  port = 8888
  targetPort = 3000
  functions = "netlify/functions"

[[redirects]]
  from = "/api/book-consultation"
  to = "/.netlify/functions/book-consultation"
  status = 200
